# OpenSSF Scorecard: checks this repository's own security practices
# (branch protection, pinned and reviewed changes, token permissions,
# dependency updates and more) and publishes the score at
# https://scorecard.dev/viewer/?uri=github.com/NYLLON-SOFTWARE/SignuDoc.
#
# Only in the SignuDoc repository itself; a copy skips it.

name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 3"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    if: github.repository == 'NYLLON-SOFTWARE/SignuDoc'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
