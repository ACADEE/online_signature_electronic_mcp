# Static analysis of the app's TypeScript and of these workflows with
# GitHub CodeQL. Findings go to the repository's Security tab.
#
# Only in the SignuDoc repository itself: a copy made by the Vercel Deploy
# button skips it (its owner can turn on CodeQL in their own settings).

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: github.repository == 'NYLLON-SOFTWARE/SignuDoc'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
