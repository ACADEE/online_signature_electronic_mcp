# Watches the app's dependencies for known vulnerabilities.
#
# - On every pull request, GitHub's dependency review fails the check when
#   the change adds a dependency with a known high or critical
#   vulnerability, or one under a license that is not allowed here.
# - Every week, and on pushes to main, npm audit checks what the app ships
#   (dev dependencies left out) and fails on a high or critical advisory.
#
# Version-update pull requests (Dependabot version updates) are left out on
# purpose: a copy made by the Vercel Deploy button would get them too, and
# they would clash with the releases that update-signudoc.yml brings in.
# Dependabot alerts and security updates are turned on in the repository's
# settings instead, which a copy does not inherit.
#
# Only in the SignuDoc repository itself; a copy skips it.

name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "11 6 * * 1"

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    if: github.repository == 'NYLLON-SOFTWARE/SignuDoc' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0

  audit:
    name: npm audit
    if: github.repository == 'NYLLON-SOFTWARE/SignuDoc' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
